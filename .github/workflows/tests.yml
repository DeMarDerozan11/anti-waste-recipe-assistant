name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pas de sentence-transformers ici : les tests n'en ont pas besoin et torch est lourd.
      - run: pip install faiss-cpu numpy pandas "groq>=0.11" "streamlit>=1.46" python-dotenv pytest httpx
      - run: python -m pytest -q
